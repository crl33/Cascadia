[project]
name = "cascadia-papsukkal"
version = "0.1.0"
description = "Cascadia Papsukkal — hydrologic intelligence platform for Washington State (V2 spike)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "pint>=0.24",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "shapely>=2.0", "import-linter>=2.3", "alembic>=1.19"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The root is a metadata + dev-tooling project only; code lives in packages/* and apps/*.
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "packages/contracts/tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:cascade_.*"]
markers = ["pg: needs a live PostgreSQL/PostGIS — skipped unless CASCADE_TEST_PG_URL is set"]

# Architecture contracts (CI gate: `lint-imports` from the repo root, inside the
# venv that scripts/install-dev.sh builds). These encode docs/ARCHITECTURE.md:
# the API is read-only assembly, contracts are pure shapes, core is the floor.
[tool.importlinter]
root_packages = [
  "cascade_contracts",
  "cascade_core",
  "cascade_geo",
  "cascade_hydrology",
  "cascade_providers_usgs",
  "cascade_providers_nwps",
  "cascade_providers_awdb",
  "cascade_providers_nbm",
  "cascade_providers_mrms",
  "cascade_api",
  "cascade_worker",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "cascade_api is read-only: no provider adapters, no job queue"
type = "forbidden"
source_modules = ["cascade_api"]
forbidden_modules = ["cascade_providers_usgs", "cascade_providers_nwps", "cascade_providers_awdb", "cascade_providers_nbm", "cascade_providers_mrms", "procrastinate"]

[[tool.importlinter.contracts]]
name = "cascade_contracts is pure shapes: nothing from core/providers/hydrology"
type = "forbidden"
source_modules = ["cascade_contracts"]
forbidden_modules = ["cascade_core", "cascade_geo", "cascade_hydrology", "cascade_providers_usgs", "cascade_providers_nwps", "cascade_providers_awdb", "cascade_providers_nbm", "cascade_providers_mrms"]

[[tool.importlinter.contracts]]
name = "cascade_hydrology is provider-agnostic: a method never imports an adapter"
type = "forbidden"
source_modules = ["cascade_hydrology"]
forbidden_modules = ["cascade_providers_usgs", "cascade_providers_nwps", "cascade_providers_awdb", "cascade_providers_nbm", "cascade_providers_mrms", "cascade_api", "cascade_worker"]

[[tool.importlinter.contracts]]
name = "cascade_geo is geometry only: no providers, no hydrology, no apps"
type = "forbidden"
source_modules = ["cascade_geo"]
forbidden_modules = ["cascade_hydrology", "cascade_providers_usgs", "cascade_providers_nwps", "cascade_providers_nbm", "cascade_providers_mrms", "cascade_api", "cascade_worker"]

[[tool.importlinter.contracts]]
name = "cascade_core is the foundation: never imports the apps"
type = "forbidden"
source_modules = ["cascade_core"]
forbidden_modules = ["cascade_api", "cascade_worker"]
