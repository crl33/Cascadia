[project]
name = "cascade-oracle"
version = "0.1.0"
description = "Cascade Oracle — hydrologic intelligence platform for Washington State (V2 spike)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "pint>=0.24",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "shapely>=2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The root is a metadata + dev-tooling project only; code lives in packages/* and apps/*.
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "packages/contracts/tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:cascade_.*"]
