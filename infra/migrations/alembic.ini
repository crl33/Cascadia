# Alembic configuration for Cascadia Papsukkal. Invoke from the repo root:
#   alembic -c infra/migrations/alembic.ini upgrade head
# The database URL is NOT stored here: env.py reads CASCADE_ALEMBIC_URL (override), else
# CASCADE_DB_URL, from the environment. Env var names only — never a credential in a file.

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
