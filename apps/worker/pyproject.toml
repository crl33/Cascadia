[project]
name = "cascade-worker"
version = "0.1.0"
description = "Cascadia Papsukkal — the only writing process: seed, scheduled provider jobs, job-run health."
requires-python = ">=3.12"
dependencies = ["cascade-core", "cascade-providers-usgs", "cascade-providers-nwps", "cascade-providers-nbm", "cascade-providers-awdb", "cascade-providers-mrms", "cascade-providers-wpc", "cascade-providers-snodas", "sqlalchemy>=2.0", "httpx>=0.27", "procrastinate>=3.9"]

[project.optional-dependencies]
# GRIB2 decoding for the NBM forcing jobs (p3-surfaces-design §1.3). Worker-only and
# deliberately an extra: eccodes drags in eccodeslib (~46 MB) and eckitlib (~10 MB), and the
# API image must not grow by ~94 MB for code the API process can never run (§4 item 7, §8).
# Build-time cost only, no recurring charge. The pip package `eccodes` is the Python binding;
# it pulls the eccodes C library 2.48 as `eccodeslib`.
grib = ["eccodes>=2.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_worker"]
