[project]
name = "cascade-api"
version = "0.1.0"
description = "Cascade Oracle — read-only FastAPI serving contract envelopes with as_of (knowledge time)."
requires-python = ">=3.12"
dependencies = ["cascade-core", "cascade-contracts", "cascade-hydrology", "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_api"]
