# CI for Cascadia Papsukkal V2 (public repo, free minutes — kept lean).
# Jobs mirror what a developer runs locally: scripts/install-dev.sh + `python -m pytest -q`
# (offline, deterministic), the pg-marked integration suite against a PostGIS service,
# the web contract/type/build gates, Playwright against the fixture stub (no network,
# no live data — tests/e2e/playwright.config.ts starts stub-api + vite preview itself),
# and a gitleaks scan. deploy-preview.yml (Cloudflare Pages hook) is separate and untouched.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/*/pyproject.toml
            packages/providers/*/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
      - name: Install packages (same order as scripts/install-dev.sh)
        run: |
          for pkg in packages/contracts packages/core packages/providers/usgs packages/providers/nwps packages/hydrology apps/api apps/worker; do
            python -m pip install -q -e "$pkg"
          done
          python -m pip install -q -e ".[dev]"
          python -m pip install -q ruff import-linter
      - name: Ruff (rule set in ruff.toml)
        run: ruff check .
      - name: Import contracts (lint-imports)
        run: lint-imports
      - name: Offline test suite (no network, SQLite only)
        run: python -m pytest -q
      - name: Contracts drift gate (schema export == committed schema)
        run: |
          python -m cascade_contracts.export_schema "$RUNNER_TEMP/schema"
          diff -ru packages/contracts/schema "$RUNNER_TEMP/schema"

  backend-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The pg-marked tests create scratch databases (CREATEDB): the postgres superuser has it.
      CASCADE_TEST_PG_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/*/pyproject.toml
            packages/providers/*/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
      - name: Install packages (same order as scripts/install-dev.sh)
        run: |
          for pkg in packages/contracts packages/core packages/providers/usgs packages/providers/nwps packages/hydrology apps/api apps/worker; do
            python -m pip install -q -e "$pkg"
          done
          python -m pip install -q -e ".[dev]"
          # test_pg_migration.py shells out to `python -m alembic`; the +psycopg URL needs the
          # driver wheel. Both are now declared upstream (alembic in the root [dev] extras,
          # psycopg[binary,pool] in cascade-core) - this explicit install is redundant
          # belt-and-braces so the pg job cannot break if those declarations move.
          python -m pip install -q alembic "psycopg[binary]"
      - name: PostgreSQL-marked suite
        run: python -m pytest -q -m pg

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Contract types drift gate
        run: npm run contracts:check
      - name: Vitest
        run: npx vitest run
      - name: Build (tsc --noEmit + vite build)
        run: npm run build

  e2e-stub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Resolve Playwright version (browser cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (download skipped on cache hit)
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E against the fixture stub (build + stub-api + vite preview)
        run: npm run e2e

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
