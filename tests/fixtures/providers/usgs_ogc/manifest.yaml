  notes: 'REAL capture, conditions B and C on real data and the decisive case of the selection note: WRAW1
    (White at R St near Auburn, 12100490), 2025-12-10T04:45-10:45Z, 25 regular samples. The last two samples
    (10:30 = 7,090 cfs / 114.95 ft; 10:45 = 7,480 / 115.11) are a short real transient at the trailing
    edge of a rising window. The shipped endpoint estimator reads -61.7 cfs/h (STEADY) and -0.025 ft/h;
    Theil-Sen reads +100 cfs/h (RISING) and +0.040 ft/h; repeated-median +115.3 cfs/h. Over the following
    6 h the river rose to 8,900 cfs, +237 cfs/h -- the robust estimators were directionally right and
    the shipped one was not. Leave-one-out: removing one sample moves the endpoint slope by 114-116 %
    and flips it to FALLING; it moves Theil-Sen by 20-21 % and does not change its direction.'
