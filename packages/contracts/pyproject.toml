[project]
name = "cascade-contracts"
version = "0.1.0"
description = "Cascade Oracle — Pydantic contracts (API + visualization) with JSON Schema export. No IO."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_contracts"]
