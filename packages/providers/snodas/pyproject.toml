[project]
name = "cascade-providers-snodas"
version = "0.1.0"
description = "Cascadia Papsukkal — SNODAS adapter: NOHRSC modeled SWE (unmasked 1 km grid), basin-aggregated daily."
requires-python = ">=3.12"
# numpy only at parse time (flat binary, not GRIB): imported lazily so the API image
# stays lean, the same discipline as the eccodes providers.
dependencies = ["cascade-core", "cascade-contracts", "cascade-geo", "httpx>=0.27", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_providers_snodas"]
