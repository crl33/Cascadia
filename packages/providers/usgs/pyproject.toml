[project]
name = "cascade-providers-usgs"
version = "0.1.0"
description = "Cascadia Papsukkal — USGS NWIS instantaneous values adapter (client, parser, normalize, jobs, canary)."
requires-python = ">=3.12"
dependencies = ["cascade-core", "httpx>=0.27", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_providers_usgs"]
