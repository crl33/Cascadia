[project]
name = "cascade-providers-awdb"
version = "0.1.0"
description = "Cascadia Papsukkal — NRCS AWDB (SNOTEL) adapter: snow-water-equivalent and precipitation CONTEXT for the susceptibility surface. Nothing here is ever scored as risk."
requires-python = ">=3.12"
dependencies = ["cascade-core", "httpx>=0.27", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_providers_awdb"]
