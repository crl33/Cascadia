[project]
name = "cascade-providers-nwrfc"
version = "0.1.0"
description = "Cascadia Papsukkal — NWRFC xml.cgi adapter: reservoir observations (forebay, storage, inflow, outflow) for the regulated basins."
requires-python = ">=3.12"
dependencies = ["cascade-core", "cascade-contracts", "httpx>=0.27", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_providers_nwrfc"]
