[project]
name = "cascade-providers-nbm"
version = "0.1.0"
description = "Cascadia Papsukkal — NBM v5.0 adapter: NOMADS WA subsets, GRIB2 decode, basin QPF and snow-level features."
requires-python = ">=3.12"
# eccodes is deliberately NOT a dependency here: it is the worker's `grib` extra
# (apps/worker/pyproject.toml). This package imports it lazily inside parser.py so the
# API image can install the package without pulling ~190 MB of GRIB libraries.
dependencies = ["cascade-core", "cascade-contracts", "cascade-geo", "cascade-hydrology", "httpx>=0.27", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_providers_nbm"]
