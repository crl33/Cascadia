[project]
name = "cascade-providers-nwps"
version = "0.1.0"
description = "Cascadia Papsukkal — NOAA NWPS v1 adapter (gauge metadata, official thresholds, official forecasts)."
requires-python = ">=3.12"
dependencies = ["cascade-core", "httpx>=0.27", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_providers_nwps"]
